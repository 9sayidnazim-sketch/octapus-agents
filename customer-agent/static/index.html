<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octapus Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
  #chat { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px;
          box-shadow: 0 2px 10px rgba(0,0,0,.1); display: flex; flex-direction: column; height: 80vh; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
  .user { background: #2563eb; color: #fff; margin-left: auto; }
  .bot  { background: #e5e7eb; color: #111; }
  form { display: flex; padding: 12px; border-top: 1px solid #ddd; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
  button { margin-left: 8px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="chat">
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask about our services......" autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let sessionId = localStorage.getItem("session_id");

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  addMsg("Hi! How can I help you today?", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMsg(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem("session_id", sessionId);
      addMsg(data.reply, "bot");
    } catch (err) {
      addMsg("Sorry, something went wrong. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
